name: factor-ia

services:
  factoria:
    build:
      context: .
      target: runtime
      args:
        # Filled by bin/bootstrap into .env; 1000 is the fallback for a bare
        # `docker compose` call on a Linux host.
        FACTOR_IA_UID: ${FACTOR_IA_UID:-1000}
        FACTOR_IA_GID: ${FACTOR_IA_GID:-1000}
    # Reap orphans: the container spawns provider CLIs whose own children
    # outlive them, and PID 1 never calls wait() — every killed run would leave
    # a <defunct> agent behind.
    init: true
    ports:
      # Loopback only. This is remote code execution as a service; LAN exposure
      # would require auth (DESIGN.md, Non-functional requirements).
      - "127.0.0.1:8000:8000"
    volumes:
      # The one surface shared with the host. A sibling of the repo, never
      # inside it — nesting makes every project reachable a second time under
      # the repo tree and puts the operator's real work where `git clean` runs.
      - ${FACTOR_IA_WORKSPACE_HOST:-../factor-ia-workspace}:/workspace
      # Every provider's config and auth. Named, never bound: the container
      # holds a live credential, which is the same reason the host's ~/.claude
      # is never mounted.
      - agent-home:/home/factoria
      # Projects registry, run history, event logs.
      - factoria-data:/data
    environment:
      # Paths are stated by the image (FACTOR_IA_WORKSPACE, FACTOR_IA_DATA,
      # CLAUDE_CONFIG_DIR). Repeating one here is how the two drift.
      #
      # Commit identity for what a run produces. Bare names, never `${VAR:-}`:
      # the default form passes these through as empty strings on a host that
      # sets none, and git reads all four ahead of every config file — so an
      # empty one beats the configured identity and `git commit` fails with
      # "empty ident name" instead. The bare form leaves an unset variable
      # unset, which is the whole difference.
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      - TZ=${TZ:-UTC}
      # The server-side opt-in a `bypassPermissions`-shaped mode is gated
      # behind (`config.dangerous_permissions_allowed`). Forwarded by bare
      # name, never `=1` here: unset is false (`config._flag`), so a fresh
      # clone still ships the gate closed and an operator turns it on in their
      # own `.env` — which is gitignored and does not travel with the repo.
      #
      # On, it lets a node name `auto` / `bypassPermissions` in its config and
      # so run commands without asking. That is the whole of what stands
      # between an agent and this container: `/home/factoria/.credentials.json`
      # and the `/workspace` bind mount are both inside the blast radius, and
      # neither is discarded with the run's worktree.
      - FACTOR_IA_DANGEROUS_PERMISSIONS
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Browser-driven checks against the real, statically-served bundle. Behind a
  # profile, so it is never built or started by a plain `docker compose up` —
  # the image it builds carries a browser the runtime has no use for.
  #
  #   docker compose --profile uitest run --rm uitest node tests/settings.mjs
  uitest:
    profiles: ["uitest"]
    build:
      context: .
      target: uitest
      args:
        FACTOR_IA_UID: ${FACTOR_IA_UID:-1000}
        FACTOR_IA_GID: ${FACTOR_IA_GID:-1000}
    # No `init: true` here, unlike the app: this image's ENTRYPOINT is already
    # tini, and Docker's own init would take PID 1 from it — which is exactly
    # the case tini warns about rather than handles.
    depends_on:
      factoria:
        condition: service_healthy
    # No published port: it reaches the app over the compose network, at the
    # service name. Nothing here is exposed to the host.
    environment:
      - FACTOR_IA_URL=http://factoria:8000
    volumes:
      # Bind-mounted so a test can be edited on the host and re-run without a
      # rebuild. Read-only: a test has no business writing to the repo.
      - ./uitests:/app/uitest/tests:ro

volumes:
  # Discarded only by an explicit `docker compose down -v`: losing this means
  # signing the container in again.
  agent-home:
  factoria-data:
