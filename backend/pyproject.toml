[project]
name = "factoria"
version = "0.1.0"
description = "Factor-ia — build and operate AI software factories"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121",
    "pydantic>=2.12",
    "uvicorn[standard]>=0.42",
]

# Not installed in the image: the Dockerfile syncs with --no-dev, so pytest and
# httpx stay out of the runtime.
[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
